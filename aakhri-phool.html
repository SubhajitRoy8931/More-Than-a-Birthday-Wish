  <script>
    // Capture script-resource failures before they can leave a blank poem page.
    window.addEventListener('error', function (event) {
      const target = event.target;

      const status = document.getElementById('poemLoadStatus');
      if (!status) return;
      const resource = target.src || '';
      status.textContent = resource.indexOf('poems-data.js') !== -1

        : 'The poem page script could not be loaded. Check the connection or site deployment, then reload.';
