<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b16">
  <meta name="description" content="The poems I wrote through love, memories and the silence that followed.">
  <title>The Poems I Wrote For You</title>
  <link rel="stylesheet" href="poem-page.css">
  <link rel="stylesheet" href="poem-collection.css">
</head>
<body>
  <div class="poem-atmosphere" aria-hidden="true"></div>
  <main class="poem-page collection-page">
    <a class="return-link" href="index.html">← Return to the story</a>
    <header class="poem-header collection-header">
      <div class="page-overline">MY WRITINGS</div>
      <h1>The Poems I Wrote For You</h1>
      <p class="poem-introduction">Twenty-three pieces I wrote across the years, through love, memories and the quiet that followed.</p>
      <div class="title-rule" aria-hidden="true"></div>
    </header>
    <nav class="collection-index" aria-label="Poem collection sections">
      <a href="#before-separation">Before the Separation <span>09</span></a>
      <a href="#after-separation">After the Separation <span>14</span></a>
    </nav>
    <p class="poem-load-status" id="poemLoadStatus" role="status" aria-live="polite">Loading the poem collection…</p>
    <div id="poemCollections">
      <noscript>Enable JavaScript to open the poem collection.</noscript>
    </div>
    <footer class="poem-footer collection-footer">
      <div class="signature">SUBHAJIT ROY</div>
      <a class="return-link footer-return" href="index.html">← Return to the story</a>
    </footer>
  </main>
  <script>
    // Capture script-resource failures before they can leave a blank poem page.
    window.addEventListener('error', function (event) {
      const target = event.target;
      if (!target || target.tagName !== 'SCRIPT') return;
      const status = document.getElementById('poemLoadStatus');
      if (!status) return;
      const resource = target.src || '';
      status.textContent = resource.indexOf('poems-data.js') !== -1
        ? 'The poem data file could not be loaded. Check the connection or site deployment, then reload.'
        : 'The poem page script could not be loaded. Check the connection or site deployment, then reload.';
      status.hidden = false;
      status.setAttribute('role', 'alert');
    }, true);
  </script>
  <script src="poems-data.js?v=aakhri-phool-20261111b"></script>
  <script src="poems.js?v=aakhri-phool-20261111b"></script>
</body>
</html>
